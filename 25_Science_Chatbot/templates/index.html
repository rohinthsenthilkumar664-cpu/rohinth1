
<!doctype html><html><head><meta name=viewport content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<style>
body{margin:0;font-family:system-ui;background:{{bg}};color:#fff;display:flex;justify-content:center}
.c{width:min(760px,100%);padding:20px}.h{color:{{primary}}}.chat{height:65vh;overflow:auto;background:#ffffff12;border-radius:18px;padding:14px}
.b{background:{{primary}};border:none;padding:12px 18px;border-radius:12px;color:#000;font-weight:700}
input{flex:1;padding:12px;border-radius:12px;border:none}
</style></head><body><div class=c><h1 class=h>{{title}}</h1><div class=chat id=chat><p>{{welcome}}</p></div>
<div style="display:flex;gap:8px;margin-top:12px"><input id=i placeholder="Ask..."><button class=b onclick=s()>Send</button></div>
<script>
async function s(){let v=i.value.trim();if(!v)return;chat.innerHTML+=`<p><b>You:</b> ${v}</p>`;i.value='';
let r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:v})});
let j=await r.json();chat.innerHTML+=`<p><b>Bot:</b> ${j.reply}</p>`;chat.scrollTop=chat.scrollHeight;}
i.onkeydown=e=>{if(e.key==='Enter')s()}
</script></div></body></html>
