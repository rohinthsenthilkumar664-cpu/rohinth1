<!doctype html><html><head><meta name=viewport content="width=device-width,initial-scale=1"><style>body{margin:0;font-family:Arial;background:{{cfg.BG}};color:white}.w{max-width:820px;margin:auto;padding:20px}.h{background:linear-gradient(135deg,{{cfg.ACCENT}},#0003);padding:20px;border-radius:20px}.c{height:60vh;overflow:auto;background:#ffffff12;border-radius:18px;padding:15px;margin:15px 0}.r{display:flex;gap:8px}input{flex:1;padding:12px;border-radius:12px;border:none}button{background:{{cfg.ACCENT}};border:none;padding:12px 16px;border-radius:12px;font-weight:bold}</style></head><body><div class=w><div class=h><h2>{{cfg.TITLE}}</h2><p>{{cfg.WELCOME}}</p></div><div id=chat class=c></div><div class=r><input id=i><button onclick=s()>Send</button><button onclick=c()>Clear</button></div></div><script>const chat=document.getElementById("chat"),i=document.getElementById("i");i.onkeydown=e=>{if(e.key==="Enter")s()};async function s(){let v=i.value.trim();if(!v)return;chat.innerHTML+=`<p><b>You:</b> ${v}</p>`;i.value="";let r=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:v})});let j=await r.json();chat.innerHTML+=`<p><b>Bot:</b> ${j.reply}</p>`;chat.scrollTop=chat.scrollHeight}async function c(){await fetch("/clear",{method:"POST"});chat.innerHTML=""}</script></body></html>
